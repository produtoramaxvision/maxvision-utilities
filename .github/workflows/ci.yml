name: CI

on:
  pull_request:
    paths:
      - 'media-forge/**'
      - '.github/workflows/ci.yml'

  # Manual trigger. validate.yml already had one; ci.yml did not, so there was no
  # way to re-run this workflow against the current tip without pushing a
  # media-forge change. That mattered on 2026-08-01: main sat with a failed CI
  # run while the fix was already merged, and nothing could prove the fix except
  # waiting for unrelated work to land.
  workflow_dispatch:
  push:
    branches: [main, homolog]
    paths:
      - 'media-forge/**'

defaults:
  run:
    working-directory: media-forge

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Node 22.x minimum: media-forge uses node:sqlite (built-in since 22.5+).
        # engines.node = >=22.5.0 in media-forge/package.json.
        node: [22.x]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: media-forge/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        # The windows-latest runner cannot start embedded-postgres, so the
        # pg-backed suites throw at collection ("Test Files: no tests" ->
        # Unhandled Error) and the step exits 1. The runner's exact refusal:
        #
        #     Execution of PostgreSQL by a user with administrative
        #     permissions is not [permitted]
        #
        # PostgreSQL refuses to run as an administrator, and the GitHub Windows
        # runner executes as one. There is no runner-side fix — it is a
        # postgres policy, not a bug in this repo. Typecheck/Lint/Build above
        # still give authoritative Windows signal, and the dev box is Windows.
        # Ubuntu remains the authoritative TEST gate.
        #
        # DO NOT remove this on the evidence that the step "reports success".
        # It always does: `continue-on-error: true` marks a step's conclusion
        # `success` even when the command exits non-zero. I removed it on
        # 2026-08-01 after reading four green Windows "Test" steps as proof the
        # constraint had lifted — the green was produced BY this line. `main`
        # went red immediately, and the log above is what was underneath.
        #
        # The only valid check is to read the step's LOG, or to flip this to
        # false on a branch and look at the result there.
        continue-on-error: ${{ matrix.os == 'windows-latest' }}
        run: pnpm test

      - name: Build
        run: pnpm exec tsup
